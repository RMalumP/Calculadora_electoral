name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar openpyxl
        run: pip install openpyxl==3.1.5
      - name: Pruebas del editor y del conversor
        run: python3 -m unittest discover -s tests -v
