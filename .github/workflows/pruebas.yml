name: Pruebas

on:
  # A mano desde la pestaña Actions: sirve para relanzar las pruebas sin tener
  # que tocar el código, y para comprobar si las Actions del repositorio
  # responden cuando una ejecución se queda encallada en la cola.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'scripts/**'
      - 'tests/**'
      - 'js/**'
      - 'tabs/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
      - 'datos/generado/**'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar openpyxl
        run: pip install openpyxl==3.1.5
      - name: Pruebas del editor y del conversor
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas del cálculo (Node)
        run: node --test tests/*.test.js
