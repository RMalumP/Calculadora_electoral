<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Electoral</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#211c18">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Electoral">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/header-tabs.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/otros-drag-responsive.css">
  <link rel="stylesheet" href="css/advanced.css">
  <link rel="stylesheet" href="css/mapa.css">
  <link rel="stylesheet" href="css/tema-oscuro.css">
  <script>try{var t=localStorage.getItem('ce-tema');if(t=='dark'||t=='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <h1>Calculadora Electoral</h1>
  <span>Sistemas de representación electoral</span>
  <div class="header-actions">
    <select id="seat-rename" onchange="updateSeatNames()">
      <option value="escaños">Escaños</option>
      <option value="parlamentarios">Parlamentarios</option>
      <option value="diputados">Diputados</option>
      <option value="concejales">Concejales</option>
      <option value="congresistas">Congresistas</option>
    </select>

    <!-- Tema: automático (el del sistema), claro u oscuro. -->
    <button class="save-icon-btn" id="theme-btn" type="button"
            title="Cambiar el tema (automático, claro u oscuro)" aria-label="Cambiar el tema">🌓</button>

    <!-- Sesión guardada automáticamente en este navegador. -->
    <button class="save-icon-btn" id="auto-clear-btn"
            title="Borrar la sesión guardada en este navegador y empezar de cero">🗑 Nueva sesión</button>

    <!-- Calculadora y pactómetro: copia autónoma de la página. -->
    <button class="save-icon-btn" id="save-html-btn" onclick="saveHTML()"
            title="Guardar la calculadora y el pactómetro en un archivo HTML que funciona por sí solo">💾</button>

    <!-- Calculadora avanzada: sólo los datos de la sesión, en un .json. -->
    <button class="save-icon-btn adv-session-btn" id="adv-save-btn" hidden
            title="Guardar en un archivo la configuración, las ediciones y los candados de esta sesión">💾 Guardar información</button>
    <button class="save-icon-btn adv-session-btn" id="adv-load-btn" hidden
            title="Cargar una sesión guardada">📂 Cargar</button>
    <input type="file" id="adv-session-file" accept=".json,application/json" hidden>
  </div>
</header>

<!-- ══ TABS ══ -->
<div class="tabs-container">
  <button class="tab active" data-tab="calculator"  onclick="switchTab('calculator')">Calculadora</button>
  <button class="tab"        data-tab="pactometer"  onclick="switchTab('pactometer')">Pactómetro</button>
  <button class="tab"        data-tab="advanced"    onclick="switchTab('advanced')">Calculadora avanzada</button>
  <button class="tab"        data-tab="map"        onclick="switchTab('map')">Mapa</button>
  <button class="tab"        data-tab="theory"      onclick="switchTab('theory')">Teoría</button>
</div>

<div class="main">

  <!-- El contenido de cada pestaña vive en tabs/ y lo inyecta js/tabs.js -->

</div><!-- /main -->

<!-- ══ PESTAÑAS: registro (js/tabs.js) y marcado de cada sección ══ -->
<script src="js/tabs.js" defer></script>
<script src="tabs/calculadora.js" defer></script>
<script src="tabs/pactometro.js" defer></script>
<script src="tabs/avanzada.js" defer></script>
<script src="tabs/mapa.js" defer></script>
<script src="tabs/teoria.js" defer></script>

<!-- ══ SCRIPTS (orden de dependencias) ══ -->
<script src="js/helpers.js" defer></script>
<script src="js/constants.js" defer></script>
<script src="js/algorithms.js" defer></script>
<script src="js/groupings.js" defer></script>
<script src="js/rows.js" defer></script>
<script src="js/totals.js" defer></script>
<script src="js/calculator.js" defer></script>
<script src="js/hemicycle.js" defer></script>
<script src="js/pactometer.js" defer></script>
<!-- La calculadora avanzada (y la base de datos local de datos/generado/) se descarga al abrir su pestaña: js/carga-avanzada.js -->
<script src="js/carga-avanzada.js" defer></script>
<script src="js/advanced-compensation.js" defer></script>
<!-- El mapa descarga su geometría al abrir la pestaña: js/mapa.js -->
<script src="js/mapa.js" defer></script>
<script src="js/session.js" defer></script>
<script src="js/autosave.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/accesibilidad.js" defer></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>

</body>
</html>
